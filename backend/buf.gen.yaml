version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-openapi
    out: internal/docs
    strategy: all
    opt:
      - path=openapi.yaml
      - base=internal/docs/openapi.base.yaml
      - features=connectrpc
      - content-types=json
      - short-service-tags
