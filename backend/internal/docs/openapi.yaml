          title: earned_seconds
          format: int64
        spentSeconds:
          type: string
          title: spent_seconds
          format: int64
        discardedSeconds:
          type: string
          title: discarded_seconds
          format: int64
      title: RewardSummary
      additionalProperties: false
      description: Earned, spent and discarded seconds of one session. Spending arrives with the Restriction API.
