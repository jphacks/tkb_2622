      additionalProperties: false
    focus.v1.Session:
      type: object
      properties:
        id:
          type: string
          title: id
        deviceId:
          type: string
          title: device_id
        taskId:
          type: string
          title: task_id
        taskSnapshot:
          allOf:
            - $ref: '#/components/schemas/focus.v1.TaskSettings'
          title: task_snapshot
          description: Task settings fixed at start.
        status:
          allOf:
            - $ref: '#/components/schemas/focus.v1.SessionStatus'
          title: status
        version:
          type: string
          title: version
          format: int64
        startedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: started_at
        pausedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: paused_at
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
