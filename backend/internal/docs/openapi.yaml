          title: id
        sessionId:
          type: string
          title: session_id
        deviceId:
          type: string
          title: device_id
        requestedSeconds:
          type: string
          title: requested_seconds
          format: int64
        reservedSeconds:
          type: string
          title: reserved_seconds
          format: int64
        status:
          allOf:
            - $ref: '#/components/schemas/restriction.v1.GrantStatus'
          title: status
        controlRevision:
          type: string
          title: control_revision
          format: int64
          description: Control revision that carries this unlock.
        issuedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: issued_at
        activatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: activated_at
        reportedSeconds:
          type: string
          title: reported_seconds
          format: int64
          description: Latest cumulative usage reported by the device.
        consumedSeconds:
          type:
            - string
            - "null"
          title: consumed_seconds
          format: int64
          description: Confirmed values. Unset until confirmed; never guessed.
        discardedSeconds:
          type:
            - string
            - "null"
          title: discarded_seconds
          format: int64
        endReason:
          allOf:
            - $ref: '#/components/schemas/restriction.v1.GrantEndReason'
          title: end_reason
        endedByOperationId:
          type: string
          title: ended_by_operation_id
        completedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: completed_at
      title: UsageGrant
      additionalProperties: false
