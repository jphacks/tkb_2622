        relatedTransitionMillis:
          type: string
          title: related_transition_millis
          format: int64
        distractionMillis:
          type: string
          title: distraction_millis
          format: int64
        unknownMillis:
          type: string
          title: unknown_millis
          format: int64
        idleMillis:
          type: string
          title: idle_millis
          format: int64
        activeMillis:
          type: string
          title: active_millis
          format: int64
        workMillis:
          type: string
          title: work_millis
          format: int64
      title: Durations
      additionalProperties: false
      description: Milliseconds per class. active = T + R + D + U + I (paused time excluded), work = T + R.
