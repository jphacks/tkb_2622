openapi: 3.1.0
info:
  title: tkb backend API
  version: v1
  description: |
    Connect RPC（JSON）のAPI仕様．protoから生成するため直接編集しない（`make -C backend generate`）．
    すべてのRPCに Supabase のアクセストークン（右上の Authorize）が必要．

    **準備**：EnsureUser → PCを RegisterDevice（MACOS／WINDOWS）→ CreateTask．iPhone制限を使う場合はiPhoneも登録し，UpdateRestrictionPolicy（enabled=true）を行う．

    **基本ループ**
    1. PC：StartSession（有効なiPhoneがなければtracking-onlyで開始）
    2. PC：UploadActivityBatch を seq=1,2,… で定期送信．新規セッションはT+Rの5分ごとに60秒を仮付与し，Q>=70%，K>=5分，計測正常を条件とする．開始済みセッションは開始時のポリシー版を維持する
    3. PC：PauseSession（last_seq に最後に送った seq）
    4. iPhone：ReserveUsageGrant で残高から秒数を確保 → ReportRestrictionState（解除適用）→ ReportUsage（累積の実利用秒数）
    5. PC：ResumeSession（利用枠の残りは破棄，残高は保持）または FinishSession／AbortSession（残高は全て破棄）

    iPhoneは常に RestrictionState の最新 control_revision を適用し，適用結果を ReportRestrictionState で報告する．
    変更系RPCは operation_id（UUID）で冪等．応答を失った場合は同じIDで再送するか Get*Operation で照会する．
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Authのアクセストークン
