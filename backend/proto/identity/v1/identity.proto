syntax = "proto3";
package identity.v1;
option go_package = "github.com/jphacks/tkb_2622/backend/gen/identity/v1;identityv1";

service IdentityService {
  rpc EnsureUser(EnsureUserRequest) returns (EnsureUserResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateDisplayName(UpdateDisplayNameRequest) returns (UpdateDisplayNameResponse);
  rpc UpdateAvatar(UpdateAvatarRequest) returns (UpdateAvatarResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc RegisterNotificationEndpoint(RegisterNotificationEndpointRequest) returns (RegisterNotificationEndpointResponse);
  rpc DeleteNotificationEndpoint(DeleteNotificationEndpointRequest) returns (DeleteNotificationEndpointResponse);
}
message User {
  string id = 1;
  string status = 2;
  string created_at = 3;
  string display_name = 4;
  string avatar_id = 5;
}
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MACOS = 1;
  PLATFORM_WINDOWS = 2;
  PLATFORM_IOS = 3;
}
message Device {
  string id = 1;
  Platform platform = 2;
  string name = 3;
  string status = 4;
  int64 version = 5;
  string created_at = 6;
}
message EnsureUserRequest { string operation_id = 1; }
message EnsureUserResponse { User user = 1; }
message GetMeRequest {}
message GetMeResponse { User user = 1; }
message UpdateDisplayNameRequest { string display_name = 1; }
message UpdateDisplayNameResponse { User user = 1; }
message UpdateAvatarRequest { string avatar_id = 1; }
message UpdateAvatarResponse { User user = 1; }
message RegisterDeviceRequest {
  string operation_id = 1;
  string registration_id = 2;
  Platform platform = 3;
  string name = 4;
}
message RegisterDeviceResponse { Device device = 1; }
message ListDevicesRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListDevicesResponse {
  repeated Device devices = 1;
  string next_page_token = 2;
}
message RevokeDeviceRequest {
  string operation_id = 1;
  string device_id = 2;
  int64 expected_version = 3;
}
message RevokeDeviceResponse { Device device = 1; }
enum APNsEnvironment {
  AP_NS_ENVIRONMENT_UNSPECIFIED = 0;
  AP_NS_ENVIRONMENT_DEVELOPMENT = 1;
  AP_NS_ENVIRONMENT_PRODUCTION = 2;
}
message RegisterNotificationEndpointRequest {
  string apns_token = 1;
  APNsEnvironment environment = 2;
}
message RegisterNotificationEndpointResponse { bool registered = 1; }
message DeleteNotificationEndpointRequest {}
message DeleteNotificationEndpointResponse { bool deleted = 1; }
