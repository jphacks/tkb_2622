syntax = "proto3";
package reward.v1;
option go_package = "github.com/jphacks/tkb_2622/backend/gen/reward/v1;rewardv1";

import "google/protobuf/timestamp.proto";

service RewardService {
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
}
// Unused reward seconds of the current (unfinished) work session. Zero with no session_id when idle.
message RewardBalance {
  string session_id = 1;
  int64 balance_seconds = 2;
  int64 version = 3;
  // Highest contiguous activity batch seq that has been evaluated for interim rewards.
  int64 evaluated_through_seq = 4;
}
// Earned, spent and discarded seconds of one session. Spending arrives with the Restriction API.
enum RewardStatus {
  REWARD_STATUS_UNSPECIFIED = 0;
  // The session is still open; eligibility may recover before the session ends.
  REWARD_STATUS_PENDING = 1;
  REWARD_STATUS_GRANTED = 2;
  // The session ended without an earned reward.
  REWARD_STATUS_INELIGIBLE = 3;
}
message RewardSummary {
  int64 earned_seconds = 1;
  int64 spent_seconds = 2;
  int64 discarded_seconds = 3;
  RewardStatus status = 4;
  int32 policy_version = 5;
  string reason = 6;
  bool grant_stopped = 7;
}
message GetBalanceRequest {}
message GetBalanceResponse { RewardBalance balance = 1; }
message RewardTransaction {
  string id = 1;
  string session_id = 2;
  string type = 3;
  int64 amount_seconds = 4;
  int64 balance_after = 5;
  google.protobuf.Timestamp occurred_at = 6;
}
message ListTransactionsRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListTransactionsResponse {
  repeated RewardTransaction transactions = 1;
  string next_page_token = 2;
}
