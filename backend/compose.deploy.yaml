services:
  api:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a fixed Artifact Registry tag or digest}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Set the runtime PostgreSQL connection with TLS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?Set the Supabase Auth issuer}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
